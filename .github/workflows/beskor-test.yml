name: Beskor API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: API-Verbindung pruefen
        env:
          BESKOR_API_KEY: ${{ secrets.BESKOR_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("BESKOR_API_KEY", "").strip()
          base = "https://beskor.net/api/v1/archeage/"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def test(name, path, authenticated=False):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "ValeriaDE-Tools/4.0"
              }
              if authenticated:
                  headers["Authorization"] = "Bearer " + key

              req = urllib.request.Request(
                  base + path, headers=headers
              )

              print("\nTEST:", name)

              try:
                  with opener.open(req, timeout=30) as response:
                      data = json.load(response)
                      print("HTTP:", response.status)
                      print("Total:", data.get("total"))
                      print("Pages:", data.get("pages"))
                      records = data.get("data", [])
                      if records and isinstance(records[0], dict):
                          print("Felder:", list(records[0].keys()))
                      return True

              except urllib.error.HTTPError as error:
                  print("HTTP:", error.code)
                  print("Content-Type:", error.headers.get("Content-Type"))
                  print("Server:", error.headers.get("Server"))
                  print("CF-Mitigated:", error.headers.get("CF-Mitigated"))
                  return False

          print("API-Key vorhanden:", bool(key))
          print("API-Key Format korrekt:", key.startswith("bsk_"))

          test("Oeffentlicher Zugang", "")
          if not key:
              raise SystemExit("API-Key fehlt")

          items = test("Items", "items/?limit=100&page=1", True)
          recipes = test("Rezepte", "recipes/?limit=100&page=1", True)

          if not (items and recipes):
              raise SystemExit(1)
          PY
