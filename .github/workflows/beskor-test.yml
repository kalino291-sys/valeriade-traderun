name: Beskor Datenbank Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Vollstaendige Datenbank abrufen
        env:
          BESKOR_API_KEY: ${{ secrets.BESKOR_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          key = os.environ["BESKOR_API_KEY"].strip()
          base = "https://beskor.net/api/v1/archeage/"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          headers = {
              "Authorization": "Bearer " + key,
              "Accept": "application/json",
              "User-Agent": "ValeriaDE-Tools/4.0"
          }

          folder = Path("beskor-data")
          folder.mkdir(exist_ok=True)

          resources = [
              "items",
              "recipes",
              "bosses",
              "npcs",
              "classes",
              "proficiencies"
          ]

          metadata = {
              "source": "Beskor Developer API",
              "updated": datetime.now(timezone.utc).isoformat(),
              "counts": {}
          }

          for resource in resources:
              records = []
              page = 1

              while True:
                  url = base + resource + f"/?limit=100&page={page}"

                  req = urllib.request.Request(
                      url, headers=headers
                  )

                  with opener.open(req, timeout=60) as response:
                      result = json.load(response)

                  if result["page"] != page:
                      raise RuntimeError("Ungueltige Seitennummer")

                  records.extend(result["data"])
                  pages = int(result["pages"])

                  print(f"{resource}: Seite {page}/{pages}")

                  if page >= pages:
                      break

                  page += 1
                  time.sleep(0.25)

              if len(records) != int(result["total"]):
                  raise RuntimeError("Unvollstaendiger Import")

              ids = [r["id"] for r in records if "id" in r]
              if len(ids) != len(set(ids)):
                  raise RuntimeError("Doppelte Datensaetze")

              with open(folder / f"{resource}.json", "w", encoding="utf-8") as file:
                  json.dump(records, file, ensure_ascii=False)

              metadata["counts"][resource] = len(records)
              print(f"FERTIG: {resource} - {len(records)} Datensaetze")
              time.sleep(0.25)

          with open(folder / "metadata.json", "w", encoding="utf-8") as file:
              json.dump(metadata, file, indent=2)

          print("DATENBANK VOLLSTAENDIG IMPORTIERT")
          PY

      - name: Datenbank als ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ValeriaDE-Beskor-Datenbank
          path: beskor-data/
          retention-days: 1
